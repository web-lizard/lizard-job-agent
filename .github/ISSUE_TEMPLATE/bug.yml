name: Сообщить об ошибке
description: Воспроизводимая проблема в работе расширения
title: "[Ошибка]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Не публикуйте API-ключи, контакты, резюме и переписку с работодателем.
  - type: input
    id: version
    attributes:
      label: Версия расширения
      placeholder: 0.10.0 / I10-20260803
    validations:
      required: true
  - type: input
    id: firefox
    attributes:
      label: Версия Firefox и операционная система
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Используйте только обезличенные примеры.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактический результат и безопасная диагностика
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка приватности
      options:
        - label: Я удалил(а) ключи и персональные данные из описания и вложений.
          required: true
