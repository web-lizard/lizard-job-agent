<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lizard Job Agent</title>
    <link rel="stylesheet" href="popup-i06.css" />
  </head>
  <body>
    <main class="popup">
      <header class="brand">
        <div class="logo">LJ</div>
        <div>
          <h1>Lizard Job Agent</h1>
          <p id="version">Версия 0.6.0</p>
        </div>
        <div class="iteration-badge">
          <strong>ИТЕРАЦИЯ 06</strong>
          <span>I06-20260802</span>
        </div>
      </header>

      <div class="build-alert">Если вы видите этот синий интерфейс — новая итерация загружена.</div>

      <section class="status-block">
        <div class="status-row">
          <span class="status-label">DeepSeek:</span>
          <span id="deepseek-status" class="status-value">…</span>
        </div>
        <div class="status-row">
          <span class="status-label">Резюме:</span>
          <span id="resume-status" class="status-value">…</span>
        </div>
        <div class="status-row">
          <span class="status-label">Чат:</span>
          <span id="chat-status" class="status-value">…</span>
        </div>
        <div class="status-row">
          <span class="status-label">Агент страницы:</span>
          <span id="agent-status" class="status-value">проверяю…</span>
        </div>
      </section>

      <section id="question-block" class="question-block hidden">
        <span>Последний вопрос</span>
        <p id="question-preview"></p>
      </section>

      <button id="reply-btn" class="button primary" type="button">Подготовить ответ</button>
      <button id="application-btn" class="button application" type="button">Подготовить сопроводительное</button>
      <button id="search-btn" class="button secondary" type="button">Открыть поиск вакансий</button>

      <div class="footer">
        <button id="settings-btn" class="button secondary" type="button">Настройки</button>
        <button id="copy-diagnostics-btn" class="link-button" type="button">Скопировать диагностику</button>
      </div>

      <p id="status" class="status hidden"></p>
      <p id="report" class="report hidden"></p>
      <p id="error" class="error hidden"></p>

      <p class="note">Ответы и письма вставляются как черновики. Расширение не нажимает «Отправить» и «Откликнуться».</p>
    </main>
    <script src="popup-i06.js"></script>
  </body>
</html>
